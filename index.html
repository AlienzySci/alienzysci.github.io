<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Peta interaktif Bima Sakti, Tata Surya, Andromeda, dan gugus bintang. Interactive map of the Milky Way, the Solar System, Andromeda and star clusters.">
<title>Galaksi Ajaib</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: satu kanvas layar penuh; judul di atas, alam semesta di tengah, kartu fakta di bawah */
:root{--sky:#0a0f2e;--ink:#1747c9;--paper:rgba(255,250,240,.92);--hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--hand);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;gap:8px}
#bar button{border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;font:bold 17px var(--hand);cursor:pointer;white-space:nowrap}
#bar{max-width:96vw;flex-wrap:wrap;justify-content:center}
#flt{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#flt[hidden]{display:none}
#flt button{border:2px solid var(--ink);background:rgba(16,22,56,.82);color:#e8eeff;border-radius:999px;padding:4px 12px;font:bold 15px var(--hand);cursor:pointer;white-space:nowrap}
#flt button[aria-pressed="true"]{background:#ffd95a;color:var(--ink)}
#flt button:focus-visible,#bar button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="Galaksi Ajaib: sentuh benda langit untuk melihat faktanya, geser untuk berpindah, cubit atau scroll untuk zoom"></canvas>
<div id="bar"><button id="nav">Ke Tata Surya</button><button id="lang">English</button><button id="exo">Eksoplanet</button><button id="mus">♪</button></div>
<div id="flt" hidden><button data-f="all">Semua</button><button data-f="g">Raksasa Gas</button><button data-f="n">Mirip Neptunus</button><button data-f="s">Bumi Super</button><button data-f="t">Berbatu</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),nav=document.getElementById('nav'),bar=document.getElementById('bar'),lgb=document.getElementById('lang'),mb=document.getElementById('mus'),xb=document.getElementById('exo'),fl=document.getElementById('flt');
let FT='all',exoOpen=false;
let MUS=true;try{MUS=localStorage.getItem('ga-mus')!='0'}catch(e){}
const BLUE='#1747c9',SUN='#ffd23f',FONT='"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive';
const GUIDE=/*GUIDE*/true;
// Dunia: pusat galaksi di (0,0), jari-jari galaksi 100 satuan. Layar = (dunia - C) * Z * B + (vx, vy)
let W,H,B,vx,vy,bg,hz,F=0,LWS=1,PM=null,ufoPh=0,angA=0,gPh=0;
let Z=1.3,Zt=1.3,follow=null;const C={x:0,y:0},Ct={x:0,y:0};
const h=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const cl=v=>Math.min(1,Math.max(0,v));
const ob=v=>{v=cl(v);return 1+2.7*Math.pow(v-1,3)+1.7*Math.pow(v-1,2)};
const pats={};
function pat(col){
  if(pats[col])return pats[col];
  const t=document.createElement('canvas');t.width=t.height=48;
  const g=t.getContext('2d');
  g.fillStyle=col;g.globalAlpha=.5;g.fillRect(0,0,48,48);
  g.strokeStyle=col;g.lineWidth=1.5;
  for(let i=0;i<45;i++){g.globalAlpha=.3+Math.random()*.6;const a=Math.random()*48,b=Math.random()*48,l=8+Math.random()*10;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
  return pats[col]=x.createPattern(t,'repeat');
}
function resize(){
  const D=devicePixelRatio||1,bb=c.getBoundingClientRect();
  W=Math.max(1,bb.width);H=Math.max(1,bb.height);
  c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  B=Math.min(W*.19,H*.17)/100;vx=W/2;vy=H*.53;
  bg=document.createElement('canvas');bg.width=W;bg.height=H;
  let g=bg.getContext('2d');const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#070b24');gr.addColorStop(.6,'#0f1240');gr.addColorStop(1,'#1c1045');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  hz=document.createElement('canvas');hz.width=W;hz.height=H;g=hz.getContext('2d');const cols=['#7b8cff','#b69cff','#8fd3ff','#ffb6dc'];g.lineWidth=1.3;
  for(let i=0;i<Math.min(1400,W*H/500);i++){g.strokeStyle=cols[i%4];g.globalAlpha=.06+Math.random()*.1;const a=Math.random()*W,b=Math.random()*H,l=6+Math.random()*14;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
}
addEventListener('resize',resize);resize();

function smooth(p){const n=p.length;x.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}x.closePath()}
function sharp(p){x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath()}
const jit=(s,i,j,w)=>1+w*(2*h(s*13.7+i*3.1+j*29+F*5.3)-1)+.04*(h(s+i)-.5);
function blob(cx,cy,rx,ry,s,j){const p=[];for(let i=0;i<14;i++){const a=i/14*6.283,k=jit(s,i,j,.04);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
function starPts(cx,cy,r,s,j){const p=[];for(let i=0;i<10;i++){const a=-1.5708+i*.6283,k=(i%2?.48:1)*jit(s,i,j,.06);p.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k])}return p}
// isi arsiran pensil + garis tepi ganda; LWS dan PM menjaga tebal garis dan arsiran tetap wajar di semua tingkat zoom
function draw(fn,col,lw=2.4,sh){
  const f=sh?sharp:smooth,p=pat(col);if(p.setTransform)p.setTransform(PM||new DOMMatrix());
  x.beginPath();f(fn(0));x.fillStyle='#fffaf0';x.fill();x.fillStyle=p;x.fill();
  x.strokeStyle=BLUE;x.lineJoin=x.lineCap='round';
  for(let j=1;j<=2;j++){x.beginPath();f(fn(j));x.lineWidth=lw*LWS*(j==1?1:.55);x.globalAlpha=j==1?.95:.5;x.stroke()}
  x.globalAlpha=1;
}
// wajah benda langit; k = kunci benda: sesaat setelah disentuh ia kaget (mata membesar, mulut O), lalu tertawa senang
function face(cx,cy,r,k){
  const a=k?lastT-(bump[k]||-9):9,wow=a<.7,joy=!wow&&a<2.4;
  x.fillStyle='rgba(255,105,150,'+(joy?.9:.6)+')';
  for(const d of[-1,1]){x.beginPath();x.arc(cx+d*r*.5,cy+r*.2,r*(joy?.16:.13),0,6.283);x.fill()}
  x.strokeStyle=BLUE;x.lineWidth=2*LWS;x.lineCap='round';
  for(const d of[-1,1]){const ex=cx+d*r*.3,ey=cy-r*.12;
    if(joy){x.beginPath();x.arc(ex,ey+r*.05,r*.11,3.5,5.92);x.stroke()}
    else{x.fillStyle='#22307f';x.beginPath();x.arc(ex,ey,r*(wow?.15:.09),0,6.283);x.fill();if(wow){x.fillStyle='#fff';x.beginPath();x.arc(ex-r*.04,ey-r*.05,r*.05,0,6.283);x.fill()}}}
  x.beginPath();
  if(wow){x.ellipse(cx,cy+r*.3,r*.1,r*.14,0,0,6.283);x.fillStyle='#7a1022';x.fill();x.stroke()}
  else if(joy){x.arc(cx,cy+r*.12,r*.3,.1,3.04);x.closePath();x.fillStyle='#c0392b';x.fill();x.stroke()}
  else{x.arc(cx,cy+r*.02,r*.28,.25,2.9);x.stroke()}
}
function glow(cx,cy,r,col){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,6.283);x.fill()}
function wrap(s,w){const out=[];let l='';for(const wd of s.split(' ')){const n=l?l+' '+wd:wd;if(l&&x.measureText(n).width>w){out.push(l);l=wd}else l=n}if(l)out.push(l);return out}

  m31:{n:'Lubang Hitam M31*',s:'M31*',col:'#e0a400',f:'Lubang hitam supermasif di pusat Andromeda. Massanya sekitar 100 juta kali Matahari.',note:147},
  pa99:{n:'Bintang PA-99-N2',s:'PA-99-N2',col:'#e0a400',f:'Bintang di Andromeda yang pada 1999 cahayanya tampak menguat karena dibelokkan gravitasi benda di depannya.',note:415},
  pa99b:{n:'Planet PA-99-N2b',s:'PA-99-N2b',col:'#2fae6b',f:'Kandidat planet pertama di luar Bima Sakti. Sampai sekarang keberadaannya belum terkonfirmasi.',note:466},
  m31rv:{n:'Bintang M31-RV',s:'M31-RV',col:'#e0503f',f:'Bintang yang pada 1988 tiba-tiba menyala merah sangat terang, lalu meredup lagi.',note:311},
  m32:{n:'Galaksi Satelit M32',s:'M32',col:'#c08a3a',f:'Galaksi kecil dan padat yang mengelilingi Andromeda, seperti bulan mengelilingi planet.',note:554},
  m110:{n:'Galaksi Satelit M110',s:'M110',col:'#4b63e0',f:'Galaksi kerdil lonjong, satelit Andromeda yang lain. Andromeda punya sedikitnya 20 galaksi satelit.',note:622},

  ms:{n:'Bintang Deret Utama',s:'Deret Utama',col:'#e0a400',f:'Bintang dewasa yang stabil, seperti Matahari kita. Sebagian besar bintang berada di tahap ini.',note:440},

  fermi:{n:'Gelembung Fermi',col:'#a05cd8',f:'Dua gelembung raksasa sinar gamma di atas dan bawah pusat galaksi. Tingginya sekitar 25.000 tahun cahaya.',note:185},
  ori:{n:'Nebula Orion',col:'#e86aa6',f:'Pabrik bintang terdekat dari Bumi, sekitar 1.300 tahun cahaya. Bisa dilihat dengan mata telanjang di rasi Orion.',note:311},

  ple:{n:'Pleiades',col:'#3d7be0',f:'Gugus terbuka Tujuh Bintang, di Jawa disebut Lintang Kartika. Bintang-bintangnya muda, panas, dan biru.',note:554},
  sir:{n:'Sirius',col:'#3d9be0',f:'Bintang paling terang di langit malam. Jaraknya hanya 8,6 tahun cahaya.',note:740},

  cyg:{n:'Cygnus X-1',col:'#3d9be0',f:'Lubang hitam bintang pertama yang ditemukan. Ia menyedot gas dari bintang pasangannya.',note:156},
  omc:{n:'Omega Centauri',col:'#c08a3a',f:'Gugus bola terbesar di Bima Sakti, berisi sekitar 10 juta bintang.',note:247},
  m13:{n:'Gugus Hercules M13',s:'M13',col:'#c08a3a',f:'Gugus bola terkenal di langit utara. Tahun 1974 manusia mengirim pesan radio Arecibo ke arahnya.',note:262},
  tuc:{n:'47 Tucanae',col:'#c08a3a',f:'Gugus bola paling terang kedua di langit, terlihat dari belahan Bumi selatan.',note:233},
  lmc:{n:'Awan Magellan Besar',col:'#4b63e0',f:'Galaksi satelit terbesar Bima Sakti, sekitar 160.000 tahun cahaya dari kita. Terlihat dari langit selatan.',note:330},
  smc:{n:'Awan Magellan Kecil',col:'#8a5cff',f:'Galaksi kerdil tetangga Awan Magellan Besar, sekitar 200.000 tahun cahaya jauhnya.',note:349},
  sgrd:{n:'Galaksi Kerdil Sagittarius',s:'Kerdil Sagittarius',col:'#c0703a',f:'Galaksi kecil yang sedang ditarik dan dicabik perlahan oleh gravitasi Bima Sakti.',note:196},
  cmd:{n:'Galaksi Kerdil Canis Major',s:'Kerdil Canis Major',col:'#c08a3a',f:'Kandidat galaksi satelit terdekat dari kita. Sebagian ilmuwan masih memperdebatkannya.',note:175},
  p1p2:{n:'Inti Ganda P1 & P2',s:'P1 & P2',col:'#d9a82b',f:'Pusat Andromeda tampak punya dua inti terang. Lubang hitam M31* berada di P2.',note:185},
  ringf:{n:'Cincin Api',col:'#e86aa6',f:'Cincin debu raksasa di piringan Andromeda, pabrik tempat bintang-bintang baru lahir.',note:294},
  ngc206:{n:'NGC 206',col:'#3d7be0',f:'Awan bintang paling terang di Andromeda, penuh bintang muda berwarna biru.',note:523},

  g1:{n:'Mayall II (G1)',col:'#c08a3a',f:'Gugus bola terbesar di Andromeda, diduga sisa inti galaksi kerdil yang pernah ditelannya.',note:247},

};

Object.assign(INFO,{

function alin(cx,cy,r,t,o){
  const ex=o.ex||'normal',k=r/100,L0=LWS,lk=(o.look||0)*12,blink=(t%4.3)<.12;

  for(const d of[-1,1]){x.save();x.translate(d*84,-6);x.rotate(d*fa);
    draw(()=>[[-d*4,-40],[d*60,-150],[d*44,0],[d*8,36]],'#ffffff',2.6,1);

    x.fillStyle='#2a3050';x.beginPath();x.arc(d*24,-10,6,0,6.283);x.fill();x.restore()}
  // bola badan, garis sambungan, dan coretan nama merah muda
  draw(j=>blob(0,0,100,96,760,j),'#ffffff',3);

  x.restore();

  const sx=lk,sy=14;
  x.beginPath();x.ellipse(sx,sy,76,42,0,0,6.283);x.fillStyle='#0c1228';x.fill();x.strokeStyle=BLUE;x.lineWidth=2.4*LWS;x.stroke();
  x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=5;x.lineCap='round';x.beginPath();x.ellipse(sx,sy,64,31,0,3.5,4.5);x.stroke();

  const col=ex=='marah'?'#ff5a4d':ex=='cinta'?'#ff6fa5':ex=='tidur'?'#3aa9b8':'#5ff2ff';
  x.strokeStyle=x.fillStyle=col;x.lineWidth=9;x.lineCap=x.lineJoin='round';x.shadowColor=col;x.shadowBlur=8;
  for(const d of[-1,1]){const e0=sx+d*32+lk*.4,e1=sy+2;x.beginPath();
    if(ex=='cinta'){x.save();x.translate(e0,e1);heart(15*(1+.15*Math.sin(t*8)));x.fill();x.restore()}
    else if(ex=='kaget'){x.arc(e0,e1,14,0,6.283);x.stroke()}
    else if(ex=='heran'){x.arc(e0,e1,d<0?16:8,0,6.283);x.stroke()}

  if(!sel&&Z<3&&!nearAnd()&&!nearClu()){const L=50*S,bx=18,by=H-58;x.strokeStyle='#8fa6e0';x.lineWidth=1.5;x.beginPath();x.moveTo(bx,by-5);x.lineTo(bx,by);x.lineTo(bx+L,by);x.lineTo(bx+L,by-5);x.stroke();x.font=Math.min(13,W*.036)+'px '+FONT;x.textAlign='left';x.textBaseline='bottom';x.fillStyle='#8fa6e0';x.fillText(U.scale,bx,by-7);x.textAlign='center';x.textBaseline='middle'}
