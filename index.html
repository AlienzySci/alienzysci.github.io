<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jelajahi Bima Sakti dan Tata Surya: sentuh 17 benda langit untuk membuka faktanya.">
<title>Galaksi Ajaib</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: satu kanvas layar penuh; judul di atas, alam semesta di tengah, kartu fakta di bawah */
:root{--sky:#0a0f2e;--ink:#1747c9;--paper:rgba(255,250,240,.92);--hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--hand);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#nav{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;font:bold 17px var(--hand);cursor:pointer;white-space:nowrap}
#nav:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="Galaksi Ajaib: sentuh benda langit untuk melihat faktanya, geser untuk berpindah, cubit atau scroll untuk zoom"></canvas>
<button id="nav">Ke Tata Surya</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),nav=document.getElementById('nav');
const BLUE='#1747c9',SUN='#ffd23f',FONT='"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive';
// Dunia: pusat galaksi di (0,0), jari-jari galaksi 100 satuan. Layar = (dunia - C) * Z * B + (vx, vy)
let W,H,B,vx,vy,bg,F=0,LWS=1,PM=null;
let Z=1.3,Zt=1.3,follow=null;const C={x:0,y:0},Ct={x:0,y:0};
const h=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const cl=v=>Math.min(1,Math.max(0,v));
const ob=v=>{v=cl(v);return 1+2.7*Math.pow(v-1,3)+1.7*Math.pow(v-1,2)};
const pats={};
function pat(col){
  if(pats[col])return pats[col];
  const t=document.createElement('canvas');t.width=t.height=48;
  const g=t.getContext('2d');
  g.fillStyle=col;g.globalAlpha=.5;g.fillRect(0,0,48,48);
  g.strokeStyle=col;g.lineWidth=1.5;
  for(let i=0;i<45;i++){g.globalAlpha=.3+Math.random()*.6;const a=Math.random()*48,b=Math.random()*48,l=8+Math.random()*10;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
  return pats[col]=x.createPattern(t,'repeat');
}
function resize(){
  const D=devicePixelRatio||1,bb=c.getBoundingClientRect();
  W=Math.max(1,bb.width);H=Math.max(1,bb.height);
  c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  B=Math.min(W*.19,H*.17)/100;vx=W/2;vy=H*.53;
  bg=document.createElement('canvas');bg.width=W;bg.height=H;
  const g=bg.getContext('2d'),gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#070b24');gr.addColorStop(.6,'#0f1240');gr.addColorStop(1,'#1c1045');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const cols=['#7b8cff','#b69cff','#8fd3ff','#ffb6dc'];g.lineWidth=1.2;
  for(let i=0;i<Math.min(1400,W*H/500);i++){g.strokeStyle=cols[i%4];g.globalAlpha=.04+Math.random()*.07;const a=Math.random()*W,b=Math.random()*H,l=6+Math.random()*14;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
}
addEventListener('resize',resize);resize();

function smooth(p){const n=p.length;x.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}x.closePath()}
function sharp(p){x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath()}
const jit=(s,i,j,w)=>1+w*(2*h(s*13.7+i*3.1+j*29+F*5.3)-1)+.04*(h(s+i)-.5);
function blob(cx,cy,rx,ry,s,j){const p=[];for(let i=0;i<14;i++){const a=i/14*6.283,k=jit(s,i,j,.04);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
function starPts(cx,cy,r,s,j){const p=[];for(let i=0;i<10;i++){const a=-1.5708+i*.6283,k=(i%2?.48:1)*jit(s,i,j,.06);p.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k])}return p}
// isi arsiran pensil + garis tepi ganda; LWS dan PM menjaga tebal garis dan arsiran tetap wajar di semua tingkat zoom
function draw(fn,col,lw=2.4,sh){
  const f=sh?sharp:smooth,p=pat(col);if(p.setTransform)p.setTransform(PM||new DOMMatrix());
  x.beginPath();f(fn(0));x.fillStyle='#fffaf0';x.fill();x.fillStyle=p;x.fill();
  x.strokeStyle=BLUE;x.lineJoin=x.lineCap='round';
  for(let j=1;j<=2;j++){x.beginPath();f(fn(j));x.lineWidth=lw*LWS*(j==1?1:.55);x.globalAlpha=j==1?.95:.5;x.stroke()}
  x.globalAlpha=1;
}
function face(cx,cy,r){
  x.fillStyle='rgba(255,105,150,.6)';
  for(const d of[-1,1]){x.beginPath();x.arc(cx+d*r*.5,cy+r*.2,r*.13,0,6.283);x.fill()}
  x.fillStyle='#22307f';
  for(const d of[-1,1]){x.beginPath();x.arc(cx+d*r*.3,cy-r*.12,r*.09,0,6.283);x.fill()}
  x.strokeStyle=BLUE;x.lineWidth=2*LWS;x.lineCap='round';
  x.beginPath();x.arc(cx,cy+r*.02,r*.28,.25,2.9);x.stroke();
}
function glow(cx,cy,r,col){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,6.283);x.fill()}
function wrap(s,w){const out=[];let l='';for(const wd of s.split(' ')){const n=l?l+' '+wd:wd;if(l&&x.measureText(n).width>w){out.push(l);l=wd}else l=n}if(l)out.push(l);return out}

// Semua benda yang bisa disentuh: nama, warna judul kartu, fakta, nada
const INFO={
  core:{n:'Inti Galaksi',col:'#e0a400',f:'Di pusat Bima Sakti ada lubang hitam raksasa bernama Sagittarius A*.',note:196},
  sol:{n:'Tata Surya Kita',col:'#e0a400',f:'Tata Surya berada di salah satu lengan Bima Sakti, sekitar 26.000 tahun cahaya dari pusatnya.',note:262},
  neb:{n:'Nebula',col:'#e86aa6',f:'Nebula adalah awan gas dan debu raksasa, tempat bintang-bintang baru lahir.',note:294},
  clu:{n:'Gugus Bintang',col:'#3d9be0',f:'Gugus bintang adalah kumpulan ratusan sampai jutaan bintang yang lahir bersama.',note:330},
  and:{n:'Galaksi Andromeda',col:'#8a5cff',f:'Tetangga besar kita, sekitar 2,5 juta tahun cahaya jauhnya. Suatu hari ia akan bertemu Bima Sakti.',note:349},
  com:{n:'Komet',col:'#ff5fa2',f:'Komet adalah bola es dan debu. Ekornya muncul saat ia mendekati Matahari.',note:880},
  sun:{n:'Matahari',col:'#e0a400',f:'Matahari adalah bintang. Besarnya cukup untuk memuat lebih dari satu juta Bumi.',note:262},
  mer:{n:'Merkurius',col:'#8d8d99',f:'Planet terkecil dan paling dekat Matahari. Satu tahunnya cuma 88 hari.',note:294},
  ven:{n:'Venus',col:'#e08a1e',f:'Planet terpanas, sekitar 465 derajat Celsius, karena awan tebalnya memerangkap panas.',note:330},
  ear:{n:'Bumi',col:'#2f7bd9',f:'Rumah kita! Satu-satunya tempat yang kita tahu punya kehidupan.',note:349},
  moon:{n:'Bulan',col:'#8d8d99',f:'Satu-satunya satelit alami Bumi. Ia menjauh dari kita sekitar 3,8 sentimeter setiap tahun.',note:370},
  mar:{n:'Mars',col:'#e0503f',f:'Si Planet Merah. Di sana ada Olympus Mons, gunung tertinggi di Tata Surya.',note:392},
  jup:{n:'Jupiter',col:'#c08a3a',f:'Planet terbesar. Bintik Merah Besarnya adalah badai yang lebih besar dari Bumi.',note:440},
  sat:{n:'Saturnus',col:'#d9a82b',f:'Cincinnya terbuat dari bongkahan es dan batu, dari sebesar pasir sampai sebesar rumah.',note:494},
  ura:{n:'Uranus',col:'#3fb5b5',f:'Planet yang berputar sambil rebahan: porosnya miring hampir 98 derajat.',note:523},
  nep:{n:'Neptunus',col:'#4b63e0',f:'Planet terjauh. Anginnya paling kencang di Tata Surya, lebih dari 2.000 km per jam.',note:587},
  plu:{n:'Pluto',col:'#a58a6d',f:'Planet kerdil di tepi Tata Surya. Di permukaannya ada dataran es berbentuk hati.',note:659}
};
const KEYS=Object.keys(INFO),found=new Set(),bump={};
let hits=[],labels=[],sel=null,doneAt=0;
// Planet: f = jarak orbit (bagian dari jari-jari Tata Surya), r = ukuran, sp = kecepatan relatif terhadap Bumi
const SU=20,PLN=[
  {k:'mer',f:.16,r:.5,col:'#b8b8b8',sp:4.1},{k:'ven',f:.24,r:.75,col:'#ffb347',sp:1.6},{k:'ear',f:.33,r:.8,col:'#4aa3ff',sp:1},
  {k:'mar',f:.42,r:.6,col:'#ff6b5b',sp:.53},{k:'jup',f:.56,r:1.7,col:'#e6b366',sp:.2},{k:'sat',f:.7,r:1.4,col:'#ffd95a',sp:.12},
  {k:'ura',f:.82,r:1.1,col:'#8fe3e3',sp:.07},{k:'nep',f:.92,r:1.05,col:'#5b7cff',sp:.05},{k:'plu',f:1,r:.42,col:'#d9c2a8',sp:.035}];
const ang={};PLN.forEach((p,i)=>ang[p.k]=i*2.4);
const armCols=['#ff7eb6','#b388ff','#ffb347','#5fd8ff'];
const stars=[];for(let i=0;i<34;i++)stars.push({x:h(i*3.3),y:h(i*7.7),r:5+h(i*1.9)*9,col:['#ffd95a','#ff9ecb','#9ae6ff','#c7a6ff'][i%4],ph:h(i)*6});
const pops=[];

// Suara: nada pendek lewat WebAudio, aktif setelah sentuhan pertama
let AC;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();else if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d,type='sine',v=.14,at=0){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+at;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05);
}
const PENTA=[523,587,659,784,880,1047,1175,1319];
const now=()=>performance.now()/1000;
let rot=0,pt=0,lastT=0,SP=[0,0];
// terbang ke Tata Surya atau kembali ke seluruh galaksi
function fly(to){
  if(to=='sol'){follow='sol';Zt=Math.min(W,H*.8)*.44/(SU*B)}else{follow=null;Ct.x=Ct.y=0;Zt=1.3}
  tone(to=='sol'?523:392,.25,'triangle',.1);tone(to=='sol'?784:262,.3,'sine',.1,.1);
}
nav.onclick=()=>{audio();fly(Z>4?'gal':'sol')};
function tap(wx,wy,sy){
  const t=now(),S=Z*B;
  for(let i=hits.length-1;i>=0;i--){
    const q=hits[i];
    if(Math.hypot(wx-q.x,wy-q.y)<Math.max(q.r,22/S)+8/S){
      const I=INFO[q.k];sel={k:q.k,t0:t};bump[q.k]=t;
      tone(I.note,.3,'triangle');tone(I.note*1.5,.35,'sine',.12,.09);
      for(let n=0;n<7;n++)pops.push({x:q.x,y:q.y,t0:t,a:n/7*6.283,r:q.r,mini:1});
      if(q.k=='sol')fly('sol');
      if(!found.has(q.k)){found.add(q.k);
        if(found.size==KEYS.length){doneAt=t;[523,659,784,1047,1319].forEach((f,n)=>tone(f,.5,'triangle',.13,.35+n*.11))}}
      return;
    }
  }
  pops.push({x:wx,y:wy,t0:t});
  tone(PENTA[Math.min(7,Math.max(0,Math.floor((1-sy/H)*8)))],.5,'sine',.12);
}
// Geser = berpindah, roda mouse atau cubit = zoom ke arah kursor/jari, ketuk = pilih
let pd=null,pinch=null;const pts=new Map();
function zoomAt(sx,sy,z){
  z=Math.max(.35,Math.min(70,z));const S=Zt*B,wx=(sx-vx)/S+Ct.x,wy=(sy-vy)/S+Ct.y;
  Zt=z;Ct.x=wx-(sx-vx)/(z*B);Ct.y=wy-(sy-vy)/(z*B);follow=null;
}
const mid=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
c.addEventListener('wheel',e=>{e.preventDefault();const r=c.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Zt*Math.exp(-e.deltaY*.0018))},{passive:false});
c.addEventListener('pointerdown',e=>{audio();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size==2){pinch={d:mid().d,z:Zt};pd=null}else pd={lx:e.clientX,ly:e.clientY,mv:0};
  try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size==2){const m=mid(),r=c.getBoundingClientRect();zoomAt(m.x-r.left,m.y-r.top,pinch.z*m.d/pinch.d);return}
  if(!pd)return;
  const dx=e.clientX-pd.lx,dy=e.clientY-pd.ly;pd.lx=e.clientX;pd.ly=e.clientY;pd.mv+=Math.abs(dx)+Math.abs(dy);
  if(pd.mv>12){follow=null;const S=Z*B;Ct.x-=dx/S;Ct.y-=dy/S;C.x=Ct.x;C.y=Ct.y;c.style.cursor='grabbing'}
});
function up(e){
  if(pd&&pd.mv<=12&&pts.size==1&&e.type=='pointerup'){const r=c.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,S=Z*B;tap((sx-vx)/S+C.x,(sy-vy)/S+C.y,sy)}
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;pd=null;c.style.cursor='grab';
}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

const bounce=(k,t)=>{const a=t-(bump[k]||-9);return a<1.5?1+.3*Math.exp(-a*4)*Math.cos(a*18):1};
const boost=(k,t)=>{const a=t-(bump[k]||-99);return 1+7*Math.exp(-a*.9)};
function card(t){
  if(!sel)return;
  const age=t-sel.t0;if(age>9){sel=null;return}
  const I=INFO[sel.k],k=ob(age/.4)*(age>8.6?(9-age)/.4:1);
  const cw=Math.min(W-32,460),pad=16,fs=Math.min(19,W*.048);
  x.font=fs+'px '+FONT;
  const lines=wrap(I.f,cw-pad*2),lh=fs*1.3,ch=pad*2+fs*1.6+lines.length*lh,cy=H-16-ch/2;
  x.save();x.translate(W/2,cy);x.scale(k,k);
  const P=[[-cw/2,-ch/2],[cw/2,-ch/2],[cw/2,ch/2],[-cw/2,ch/2]];
  draw(j=>P.map((p,i)=>[p[0]+(h(i*5+j*3+F)-.5)*5,p[1]+(h(i*7+j*5+F)-.5)*5]),'#ffffff',2.6,1);
  x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  x.font='bold '+fs*1.3+'px '+FONT;x.lineWidth=4;x.strokeStyle=BLUE;
  x.strokeText(I.n,0,-ch/2+pad+fs*.6);x.fillStyle=I.col;x.fillText(I.n,0,-ch/2+pad+fs*.6);
  x.font=fs+'px '+FONT;x.fillStyle='#22307f';
  lines.forEach((l,i)=>x.fillText(l,0,-ch/2+pad+fs*1.6+lh*(i+.5)));
  x.restore();
}
// satu benda yang bisa disentuh: catat untuk ketukan, beri nama bila cukup besar di layar
function body(k,cx,cy,r,S,lab){hits.push({k,x:cx,y:cy,r});if(lab&&r*S>5)labels.push({t:INFO[k].n,x:cx,y:cy+r,k})}

function solar(t,dt,S){
  const sx=SP[0],sy=SP[1],px=SU*S; // px = jari-jari Tata Surya di layar
  if(px<70){ // dari jauh: titik berkilau + cincin penanda
    glow(sx,sy,9+2*Math.sin(t*3),'rgba(255,220,120,.9)');
    x.save();x.translate(sx,sy);x.rotate(t);x.setLineDash([7/S,7/S]);x.strokeStyle='#fff';x.lineWidth=2.4/S;x.beginPath();x.arc(0,0,Math.max(SU*.6,16/S),0,6.283);x.stroke();x.restore();x.setLineDash([]);
    hits.push({k:'sol',x:sx,y:sy,r:Math.max(SU*.6,16/S)});labels.push({t:'Tata Surya',x:sx,y:sy-Math.max(SU*.6,16/S)-28/S,k:'sol'});
    PLN.forEach(p=>ang[p.k]+=dt*.5*p.sp);return;
  }
  x.setLineDash([5/S,6/S]);x.strokeStyle='rgba(160,200,255,.45)';x.lineWidth=1.3/S;
  PLN.forEach(p=>{x.beginPath();x.ellipse(sx,sy,SU*p.f,SU*p.f*.62,0,0,6.283);x.stroke()});x.setLineDash([]);
  for(let i=0;i<60;i++){const a=i/60*6.283+pt*.2+h(i)*.2,rr=SU*(.49+h(i*3)*.03);x.fillStyle=['#c9b3ff','#ffd9a0','#b8b8b8'][i%3];x.globalAlpha=.5+.4*h(i*5);x.beginPath();x.arc(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr*.62,(1+h(i*7))/S,0,6.283);x.fill()}x.globalAlpha=1;
  // Matahari
  const sr=2.4*bounce('sun',t),fl=t-(bump.sun||-9);
  for(let i=0;i<10;i++){const a=i/10*6.283+t*.3;x.fillStyle='rgba(255,210,100,.1)';x.beginPath();x.moveTo(sx,sy);x.arc(sx,sy,sr*(2.2+.3*Math.sin(t*3+i)),a,a+.25);x.closePath();x.fill()}
  glow(sx,sy,sr*2.2,'rgba(255,200,80,.55)');
  if(fl<1.5){x.strokeStyle='rgba(255,220,120,'+(1-fl/1.5)+')';x.lineWidth=3/S;x.beginPath();x.arc(sx,sy,sr+fl*SU*.5,0,6.283);x.stroke()}
  draw(j=>blob(sx,sy,sr,sr,2,j),SUN,2.6);if(sr*S>14)face(sx,sy,sr*.9);body('sun',sx,sy,sr,S,1);
  PLN.map(p=>{ang[p.k]+=dt*.5*p.sp*boost(p.k,t);const a=ang[p.k];return{p,x:sx+Math.cos(a)*SU*p.f,y:sy+Math.sin(a)*SU*p.f*.62}})
  .sort((u,v)=>u.y-v.y).forEach(o=>{
    const p=o.p,r=p.r*bounce(p.k,t),sr2=r*S;
    if(p.k=='sat'){x.save();x.translate(o.x,o.y);x.rotate(-.35+.25*Math.exp(-(t-(bump.sat||-9)))*Math.sin(t*9));draw(j=>blob(0,0,r*2,r*.6,70,j),'#ff9ecb',1.8);x.restore()}
    draw(j=>blob(o.x,o.y,r,r,p.f*50,j),p.col,2.2);
    x.save();x.beginPath();x.arc(o.x,o.y,r*.94,0,6.283);x.clip();
    if(p.k=='ear'&&sr2>6){x.fillStyle='rgba(80,200,120,.85)';[[-.35,-.3,.38,.3],[.4,.25,.34,.4],[-.1,.6,.3,.2]].forEach(q=>{x.beginPath();x.ellipse(o.x+q[0]*r,o.y+q[1]*r,q[2]*r,q[3]*r,.4,0,6.283);x.fill()})}
    if(p.k=='jup'&&sr2>8){x.strokeStyle='rgba(180,110,60,.55)';x.lineWidth=r*.16;[-.45,-.05,.35].forEach(q=>{x.beginPath();x.moveTo(o.x-r,o.y+q*r);x.lineTo(o.x+r,o.y+q*r);x.stroke()});x.fillStyle='#e0503f';x.beginPath();x.ellipse(o.x+r*.35,o.y+r*.3,r*.22,r*.14,0,0,6.283);x.fill()}
    if(p.k=='plu'&&sr2>8){x.fillStyle='#fff7ee';for(const d of[-1,1]){x.beginPath();x.arc(o.x+d*r*.2,o.y+r*.1,r*.26,0,6.283);x.fill()}x.beginPath();x.moveTo(o.x-r*.44,o.y+r*.2);x.lineTo(o.x,o.y+r*.72);x.lineTo(o.x+r*.44,o.y+r*.2);x.fill()}
    if(p.k=='mar'&&sr2>8){x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(o.x,o.y-r*.85,r*.5,r*.25,0,0,6.283);x.fill()}
    x.restore();
    if(sr2>16&&p.k!='jup'&&p.k!='plu')face(o.x,o.y+r*.05,r);
    if(p.k=='sat'){x.save();x.translate(o.x,o.y);x.rotate(-.35+.25*Math.exp(-(t-(bump.sat||-9)))*Math.sin(t*9));x.beginPath();x.ellipse(0,0,r*2,r*.6,0,.2,2.94);x.strokeStyle='#ff9ecb';x.lineWidth=r*.24;x.lineCap='round';x.stroke();x.strokeStyle=BLUE;x.lineWidth=1.6/S;x.stroke();x.restore()}
    if(p.k=='ura'){x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=1.6/S;x.beginPath();x.ellipse(o.x,o.y,r*.5,r*1.5,.25,0,6.283);x.stroke()}
    body(p.k,o.x,o.y,r,S,1);
    if(p.k=='ear'){const ma=t*1.6*boost('moon',t)/2+pt,mr=.26*bounce('moon',t),mx=o.x+Math.cos(ma)*r*2.1,my=o.y+Math.sin(ma)*r*1.3;
      x.strokeStyle='rgba(200,220,255,.3)';x.lineWidth=1/S;x.beginPath();x.ellipse(o.x,o.y,r*2.1,r*1.3,0,0,6.283);x.stroke();
      draw(j=>blob(mx,my,mr,mr,50,j),'#e6e6f0',1.6);body('moon',mx,my,mr,S,mr*S>6)}
  });
}

function frame(ms){
  const t=ms/1000,dt=Math.min(.05,t-lastT);lastT=t;F=Math.floor(t*7);
  rot+=dt*.18/(1+Z*.6);pt+=dt;
  // letak Tata Surya: di celah antara dua lengan spiral, ikut berputar bersama galaksi
  SP=[Math.cos(2.74+rot)*66,Math.sin(2.74+rot)*66*.55];
  if(follow=='sol'){Ct.x=SP[0];Ct.y=SP[1]}
  const e=Math.min(1,dt*6);Z+=(Zt-Z)*e;C.x+=(Ct.x-C.x)*e;C.y+=(Ct.y-C.y)*e;
  const S=Z*B;hits=[];labels=[];
  nav.textContent=Z>4?'Ke Galaksi':'Ke Tata Surya';
  x.clearRect(0,0,W,H);x.drawImage(bg,0,0);
  LWS=1;PM=null;
  x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=.75*(.3+.7*Math.abs(Math.sin(t*1.3+i*2.1)));x.beginPath();x.arc(h(i*1.3)*W,h(i*7.1)*H,.8+h(i*3.7)*1.8,0,6.283);x.fill()}x.globalAlpha=1;
  // bintang latar bergeser lebih pelan dari benda di depan (paralaks)
  const pz=Math.pow(Z,.3);x.save();x.translate(vx-C.x*B*.15,vy-C.y*B*.15);x.scale(pz,pz);x.translate(-vx,-vy);
  stars.forEach((s,i)=>draw(j=>starPts((s.x*1.8-.4)*W,(s.y*1.7-.35)*H,s.r*(1+.22*Math.sin(t*2+s.ph))/Math.pow(pz,.6),i,j),s.col,1.8,1));
  x.restore();

  // ===== dunia =====
  x.save();x.translate(vx,vy);x.scale(S,S);x.translate(-C.x,-C.y);
  LWS=Math.pow(Z,.12)/S;PM=new DOMMatrix([1/S,0,0,1/S,0,0]);
  // nebula hiasan
  [['rgba(140,90,255,.22)',-150,-90,220],['rgba(80,170,255,.18)',30,160,180]].forEach((n,i)=>glow(n[1]+25*Math.sin(t*.15+i),n[2]+20*Math.cos(t*.12+i*2),n[3],n[0]));
  // Andromeda, tetangga jauh
  {const k=bounce('and',t);x.save();x.translate(-430,-340);x.rotate(.5+t*.02);x.scale(k,k*.5);glow(0,0,90,'rgba(190,160,255,.75)');
   x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=5;x.lineCap='round';for(let a=0;a<2;a++){x.beginPath();for(let f=0;f<=1.001;f+=.1){const rr=90*(.15+.75*f),th=a*3.1416+f*3.2;f?x.lineTo(Math.cos(th)*rr,Math.sin(th)*rr):x.moveTo(Math.cos(th)*rr,Math.sin(th)*rr)}x.stroke()}
   glow(0,0,26,'rgba(255,240,210,.95)');x.restore();body('and',-430,-340,60,S,1)}
  // nebula tempat bintang lahir
  {const k=bounce('neb',t),nx=185,ny=-165;glow(nx-20,ny,70*k,'rgba(255,110,180,.5)');glow(nx+30,ny+15,60*k,'rgba(255,170,90,.4)');glow(nx,ny-25,50*k,'rgba(140,120,255,.45)');
   for(let i=0;i<6;i++)draw(j=>starPts(nx+(h(i*3)-.5)*90,ny+(h(i*5)-.5)*70,(4+h(i)*4)*(1+.3*Math.sin(t*3+i)),500+i,j),'#ffffff',1.4,1);body('neb',nx,ny,48,S,1)}
  // gugus bintang
  {const k=bounce('clu',t),ux=-200,uy=150;glow(ux,uy,60,'rgba(120,190,255,.3)');
   for(let i=0;i<16;i++){const a=h(i*2.1)*6.283+t*.1,r=Math.pow(h(i*4.7),.7)*42*k;draw(j=>starPts(ux+Math.cos(a)*r,uy+Math.sin(a)*r,(3+h(i*1.3)*5)*(1+.25*Math.sin(t*4+i)),520+i,j),['#9ae6ff','#ffffff','#ffd95a'][i%3],1.4,1)}body('clu',ux,uy,44,S,1)}
  // sinar inti + cahaya galaksi
  for(let i=0;i<10;i++){const a=i/10*6.283+t*.12;x.fillStyle='rgba(255,220,160,.07)';x.beginPath();x.moveTo(0,0);x.arc(0,0,150+15*Math.sin(t*2+i),a,a+.2);x.closePath();x.fill()}
  glow(0,0,140,'rgba(255,214,250,'+(.5+.15*Math.sin(t*1.7))+')');
  // lengan spiral
  // saat masuk ke Tata Surya, gumpalan lengan mengecil supaya tidak menutupi planet
  const ak=cl((6.5-Z)/2.5);
  x.save();x.scale(1,.55);x.rotate(rot);
  if(ak>0)for(let a=0;a<3;a++)for(let i=0;i<13;i++){
    const f=(i+1)/13,r=100*(.25+.8*f),th=a*2.094+f*3.3,s=ak*100*(.09-.04*f)*(1+.14*Math.sin(t*2.4+i*.7+a*2)),bx=Math.cos(th)*r,by=Math.sin(th)*r;
    draw(j=>blob(bx,by,s,s,a*20+i,j),armCols[(a+i)%4],1.8);
    for(let d=0;d<2;d++){const q=h(a*50+i*5+d);draw(j=>blob(bx+(q-.5)*25,by+(h(q*9)-.5)*25,s*.4,s*.4,i+d*7,j),armCols[(a+i+d+1)%4],1.4)}
  }
  x.restore();
  // inti galaksi
  {const k=bounce('core',t);x.save();x.rotate(Math.sin(t*.6)*.08);x.scale(k,k);draw(j=>blob(0,0,30,27,99,j),SUN,3);face(0,0,30);x.restore();body('core',0,0,30,S,1)}
  solar(t,dt,S);
  // komet melintas
  {const s=(t%6)/2.2;if(s<1){const kx=260-520*s,ky=-230+210*s,k=bounce('com',t);x.lineCap='round';
    ['#ff9ecb','#9ae6ff','#ffd95a'].forEach((col,i)=>{x.strokeStyle=col;x.globalAlpha=.7;x.lineWidth=4*LWS*1.4;x.beginPath();x.moveTo(kx+12+i*4,ky-5-i*2);x.lineTo(kx+70+i*5,ky-30+i*4);x.stroke()});x.globalAlpha=1;
    draw(j=>starPts(kx,ky,9*k,200,j),'#ffd95a',2.4,1);body('com',kx,ky,14,S,0)}}
  // lingkaran penanda benda terpilih
  if(sel){const q=hits.find(v=>v.k==sel.k);if(q){x.save();x.translate(q.x,q.y);x.rotate(t*1.2);x.setLineDash([7/S,8/S]);x.strokeStyle='#fff';x.lineWidth=2.4/S;x.beginPath();x.arc(0,0,q.r*1.35+6/S,0,6.283);x.stroke();x.restore();x.setLineDash([])}}
  // bintang hasil sentuhan dan percikan dari benda yang disentuh
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i],age=t-p.t0,life=p.mini?.9:3;
    if(age<0)continue;if(age>life){pops.splice(i,1);continue}
    if(p.mini){const d=p.r+age*60/S;draw(j=>starPts(p.x+Math.cos(p.a)*d,p.y+Math.sin(p.a)*d,9/S*(1-age/life),300+i,j),['#ffd95a','#ff9ecb','#9ae6ff'][i%3],1.4,1)}
    else{const rr=22/S*(Math.min(1,age*4)+.15*Math.sin(age*10))*(age>2?3-age:1);if(rr*S>1.5)draw(j=>starPts(p.x,p.y-age*14/S,rr,300+i,j),['#ffd95a','#ff9ecb','#9ae6ff'][i%3],2.2,1)}
  }
  x.restore();LWS=1;PM=null;
  // ===== layar =====
  x.textAlign='center';x.textBaseline='top';x.lineJoin='round';x.font='bold '+Math.min(15,W*.04)+'px '+FONT;
  labels.forEach(l=>{const lx=(l.x-C.x)*S+vx,ly=(l.y-C.y)*S+vy+5;if(lx<-60||lx>W+60||ly<150||ly>H-10)return;x.lineWidth=3.5;x.strokeStyle='rgba(10,15,46,.85)';x.strokeText(l.t,lx,ly);x.fillStyle=found.has(l.k)?'#ffd95a':'#e8eeff';x.fillText(l.t,lx,ly)});
  // judul
  const ty=Math.max(40,H*.075),fs=Math.min(W*.1,52);
  x.save();x.translate(W/2,ty);x.rotate(Math.sin(t)*.015);
  x.font='bold '+fs+'px '+FONT;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=5;x.strokeStyle=BLUE;x.lineJoin='round';x.strokeText('Galaksi Ajaib',0,0);x.fillStyle='#ffb347';x.fillText('Galaksi Ajaib',0,0);
  x.restore();
  x.font='bold '+Math.min(18,W*.05)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffd95a';
  x.fillText('★ Ditemukan '+found.size+' dari '+KEYS.length,W/2,ty+fs*.85);
  nav.style.top=(ty+fs*.85+18)+'px';
  card(t);
  if(!sel){
    x.font=Math.min(18,W*.045)+'px '+FONT;x.fillStyle='#c9d6ff';
    x.fillText(doneAt?'Hebat! Semua benda langit sudah kamu temukan':'Sentuh semuanya! Geser = jalan-jalan, cubit/scroll = zoom',W/2,H-24);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
