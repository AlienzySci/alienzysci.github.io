<head>

<meta name="description" content="Peta interaktif Bima Sakti, Tata Surya, Andromeda, dan gugus bintang. Interactive map of the Milky Way, the Solar System, Andromeda and star clusters.">
<title>Galaksi Ajaib</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: satu kanvas layar penuh; judul di atas, alam semesta di tengah, kartu fakta di bawah */
:root{--sky:#0a0f2e;--ink:#1747c9;--paper:rgba(255,250,240,.92);--hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--hand);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;gap:8px}
#bar button{border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;font:bold 17px var(--hand);cursor:pointer;white-space:nowrap}
#bar button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="Galaksi Ajaib: sentuh benda langit untuk melihat faktanya, geser untuk berpindah, cubit atau scroll untuk zoom"></canvas>
<div id="bar"><button id="nav">Ke Tata Surya</button><button id="lang">English</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),nav=document.getElementById('nav'),bar=document.getElementById('bar'),lgb=document.getElementById('lang');
const BLUE='#1747c9',SUN='#ffd23f',FONT='"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive';
// Dunia: pusat galaksi di (0,0), jari-jari galaksi 100 satuan. Layar = (dunia - C) * Z * B + (vx, vy)
let W,H,B,vx,vy,bg,hz,F=0,LWS=1,PM=null,ufoPh=0,angA=0;
let Z=1.3,Zt=1.3,follow=null;const C={x:0,y:0},Ct={x:0,y:0};
const h=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const cl=v=>Math.min(1,Math.max(0,v));
const ob=v=>{v=cl(v);return 1+2.7*Math.pow(v-1,3)+1.7*Math.pow(v-1,2)};
const pats={};
function pat(col){
  if(pats[col])return pats[col];
  const t=document.createElement('canvas');t.width=t.height=48;
  const g=t.getContext('2d');
  g.fillStyle=col;g.globalAlpha=.5;g.fillRect(0,0,48,48);
  g.strokeStyle=col;g.lineWidth=1.5;
  for(let i=0;i<45;i++){g.globalAlpha=.3+Math.random()*.6;const a=Math.random()*48,b=Math.random()*48,l=8+Math.random()*10;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
  return pats[col]=x.createPattern(t,'repeat');
}
function resize(){
  const D=devicePixelRatio||1,bb=c.getBoundingClientRect();
  W=Math.max(1,bb.width);H=Math.max(1,bb.height);
  c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  B=Math.min(W*.19,H*.17)/100;vx=W/2;vy=H*.53;
  bg=document.createElement('canvas');bg.width=W;bg.height=H;
  let g=bg.getContext('2d');const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#070b24');gr.addColorStop(.6,'#0f1240');gr.addColorStop(1,'#1c1045');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  hz=document.createElement('canvas');hz.width=W;hz.height=H;g=hz.getContext('2d');const cols=['#7b8cff','#b69cff','#8fd3ff','#ffb6dc'];g.lineWidth=1.3;
  for(let i=0;i<Math.min(1400,W*H/500);i++){g.strokeStyle=cols[i%4];g.globalAlpha=.06+Math.random()*.1;const a=Math.random()*W,b=Math.random()*H,l=6+Math.random()*14;g.beginPath();g.moveTo(a,b);g.lineTo(a+l,b-l);g.stroke()}
}
addEventListener('resize',resize);resize();

function smooth(p){const n=p.length;x.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}x.closePath()}
function sharp(p){x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath()}
const jit=(s,i,j,w)=>1+w*(2*h(s*13.7+i*3.1+j*29+F*5.3)-1)+.04*(h(s+i)-.5);
function blob(cx,cy,rx,ry,s,j){const p=[];for(let i=0;i<14;i++){const a=i/14*6.283,k=jit(s,i,j,.04);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
function starPts(cx,cy,r,s,j){const p=[];for(let i=0;i<10;i++){const a=-1.5708+i*.6283,k=(i%2?.48:1)*jit(s,i,j,.06);p.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k])}return p}
// isi arsiran pensil + garis tepi ganda; LWS dan PM menjaga tebal garis dan arsiran tetap wajar di semua tingkat zoom
function draw(fn,col,lw=2.4,sh){
  const f=sh?sharp:smooth,p=pat(col);if(p.setTransform)p.setTransform(PM||new DOMMatrix());
  x.beginPath();f(fn(0));x.fillStyle='#fffaf0';x.fill();x.fillStyle=p;x.fill();
  x.strokeStyle=BLUE;x.lineJoin=x.lineCap='round';
  for(let j=1;j<=2;j++){x.beginPath();f(fn(j));x.lineWidth=lw*LWS*(j==1?1:.55);x.globalAlpha=j==1?.95:.5;x.stroke()}
  x.globalAlpha=1;
}
function face(cx,cy,r){
  x.fillStyle='rgba(255,105,150,.6)';
  for(const d of[-1,1]){x.beginPath();x.arc(cx+d*r*.5,cy+r*.2,r*.13,0,6.283);x.fill()}
  x.fillStyle='#22307f';
  for(const d of[-1,1]){x.beginPath();x.arc(cx+d*r*.3,cy-r*.12,r*.09,0,6.283);x.fill()}
  x.strokeStyle=BLUE;x.lineWidth=2*LWS;x.lineCap='round';
  x.beginPath();x.arc(cx,cy+r*.02,r*.28,.25,2.9);x.stroke();
}
function glow(cx,cy,r,col){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,6.283);x.fill()}
function wrap(s,w){const out=[];let l='';for(const wd of s.split(' ')){const n=l?l+' '+wd:wd;if(l&&x.measureText(n).width>w){out.push(l);l=wd}else l=n}if(l)out.push(l);return out}

  x.setLineDash([5/S,6/S]);x.strokeStyle='rgba(160,200,255,.45)';x.lineWidth=1.3/S;
  PLN.forEach(p=>{x.beginPath();x.ellipse(sx,sy,SU*p.f,SU*p.f*.62,0,0,6.283);x.stroke()});x.setLineDash([]);
  for(let i=0;i<60;i++){const a=i/60*6.283+pt*.2+h(i)*.2,rr=SU*(.49+h(i*3)*.03);x.fillStyle=['#c9b3ff','#ffd9a0','#b8b8b8'][i%3];x.globalAlpha=.5+.4*h(i*5);x.beginPath();x.arc(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr*.62,(1+h(i*7))/S,0,6.283);x.fill()}x.globalAlpha=1;
  // Matahari
  const sr=2.4*bounce('sun',t),fl=t-(bump.sun||-9);
  for(let i=0;i<10;i++){const a=i/10*6.283+t*.3;x.fillStyle='rgba(255,210,100,.1)';x.beginPath();x.moveTo(sx,sy);x.arc(sx,sy,sr*(2.2+.3*Math.sin(t*3+i)),a,a+.25);x.closePath();x.fill()}
  glow(sx,sy,sr*2.2,'rgba(255,200,80,.55)');
  if(fl<1.5){x.strokeStyle='rgba(255,220,120,'+(1-fl/1.5)+')';x.lineWidth=3/S;x.beginPath();x.arc(sx,sy,sr+fl*SU*.5,0,6.283);x.stroke()}
  draw(j=>blob(sx,sy,sr,sr,2,j),SUN,2.6);if(sr*S>14)face(sx,sy,sr*.9);body('sun',sx,sy,sr,S,1);
  PLN.map(p=>{ang[p.k]+=dt*.5*p.sp*boost(p.k,t);const a=ang[p.k];return{p,x:sx+Math.cos(a)*SU*p.f,y:sy+Math.sin(a)*SU*p.f*.62}})
  .sort((u,v)=>u.y-v.y).forEach(o=>{
    const p=o.p,r=p.r*bounce(p.k,t),sr2=r*S;
    if(p.k=='sat'){x.save();x.translate(o.x,o.y);x.rotate(-.35+.25*Math.exp(-(t-(bump.sat||-9)))*Math.sin(t*9));draw(j=>blob(0,0,r*2,r*.6,70,j),'#ff9ecb',1.8);x.restore()}
    draw(j=>blob(o.x,o.y,r,r,p.f*50,j),p.col,2.2);
    x.save();x.beginPath();x.arc(o.x,o.y,r*.94,0,6.283);x.clip();
    if(p.k=='ear'&&sr2>6){x.fillStyle='rgba(80,200,120,.85)';[[-.35,-.3,.38,.3],[.4,.25,.34,.4],[-.1,.6,.3,.2]].forEach(q=>{x.beginPath();x.ellipse(o.x+q[0]*r,o.y+q[1]*r,q[2]*r,q[3]*r,.4,0,6.283);x.fill()})}
    if(p.k=='jup'&&sr2>8){x.strokeStyle='rgba(180,110,60,.55)';x.lineWidth=r*.16;[-.45,-.05,.35].forEach(q=>{x.beginPath();x.moveTo(o.x-r,o.y+q*r);x.lineTo(o.x+r,o.y+q*r);x.stroke()});x.fillStyle='#e0503f';x.beginPath();x.ellipse(o.x+r*.35,o.y+r*.3,r*.22,r*.14,0,0,6.283);x.fill()}
    if(p.k=='plu'&&sr2>8){x.fillStyle='#fff7ee';for(const d of[-1,1]){x.beginPath();x.arc(o.x+d*r*.2,o.y+r*.1,r*.26,0,6.283);x.fill()}x.beginPath();x.moveTo(o.x-r*.44,o.y+r*.2);x.lineTo(o.x,o.y+r*.72);x.lineTo(o.x+r*.44,o.y+r*.2);x.fill()}
    if(p.k=='mar'&&sr2>8){x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(o.x,o.y-r*.85,r*.5,r*.25,0,0,6.283);x.fill()}
    x.restore();
    if(sr2>16&&p.k!='jup'&&p.k!='plu')face(o.x,o.y+r*.05,r);
    if(p.k=='sat'){x.save();x.translate(o.x,o.y);x.rotate(-.35+.25*Math.exp(-(t-(bump.sat||-9)))*Math.sin(t*9));x.beginPath();x.ellipse(0,0,r*2,r*.6,0,.2,2.94);x.strokeStyle='#ff9ecb';x.lineWidth=r*.24;x.lineCap='round';x.stroke();x.strokeStyle=BLUE;x.lineWidth=1.6/S;x.stroke();x.restore()}
    if(p.k=='ura'){x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=1.6/S;x.beginPath();x.ellipse(o.x,o.y,r*.5,r*1.5,.25,0,6.283);x.stroke()}
    body(p.k,o.x,o.y,r,S,1);
    if(p.k=='ear'){const ma=t*1.6*boost('moon',t)/2+pt,mr=.26*bounce('moon',t),mx=o.x+Math.cos(ma)*r*2.1,my=o.y+Math.sin(ma)*r*1.3;
      x.strokeStyle='rgba(200,220,255,.3)';x.lineWidth=1/S;x.beginPath();x.ellipse(o.x,o.y,r*2.1,r*1.3,0,0,6.283);x.stroke();
      draw(j=>blob(mx,my,mr,mr,50,j),'#e6e6f0',1.6);body('moon',mx,my,mr,S,mr*S>6)}
  });
}

function frame(ms){
  const t=ms/1000,dt=Math.min(.05,t-lastT);lastT=t;F=Math.floor(t*7);
  rot+=dt*.18/(1+Z*.6);pt+=dt;
  // letak Tata Surya: di celah antara dua lengan spiral, ikut berputar bersama galaksi
  SP=[Math.cos(2.74+rot)*66,Math.sin(2.74+rot)*66*.55];
  if(follow=='sol'){Ct.x=SP[0];Ct.y=SP[1]}
  const e=Math.min(1,dt*6);Z+=(Zt-Z)*e;C.x+=(Ct.x-C.x)*e;C.y+=(Ct.y-C.y)*e;
  const S=Z*B;hits=[];labels=[];
  nav.textContent=Z>4||nearAnd()||nearClu()?U.toMW:U.toSol;
  x.clearRect(0,0,W,H);x.drawImage(bg,0,0);
  {const ox=(t*10)%W,oy=(t*10)%H;for(const dx of[0,W])for(const dy of[0,-H])x.drawImage(hz,dx-ox,dy+oy)}
  LWS=1;PM=null;
  x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=.75*(.3+.7*Math.abs(Math.sin(t*1.3+i*2.1)));x.beginPath();x.arc(h(i*1.3)*W,h(i*7.1)*H,.8+h(i*3.7)*1.8,0,6.283);x.fill()}x.globalAlpha=1;
  // bintang latar bergeser lebih pelan dari benda di depan (paralaks)
  const pz=Math.pow(Z,.3);x.save();x.translate(vx-C.x*B*.15,vy-C.y*B*.15);x.scale(pz,pz);x.translate(-vx,-vy);
  stars.forEach((s,i)=>draw(j=>starPts((s.x*1.8-.4)*W,(s.y*1.7-.35)*H,s.r*(1+.22*Math.sin(t*2+s.ph))/Math.pow(pz,.6),i,j),s.col,1.8,1));
  x.restore();

  // ===== dunia =====
  x.save();x.translate(vx,vy);x.scale(S,S);x.translate(-C.x,-C.y);
  LWS=Math.pow(Z,.12)/S;PM=new DOMMatrix([1/S,0,0,1/S,0,0]);
  // nebula hiasan
  [['rgba(140,90,255,.22)',-150,-90,220],['rgba(80,170,255,.18)',30,160,180]].forEach((n,i)=>glow(n[1]+25*Math.sin(t*.15+i),n[2]+20*Math.cos(t*.12+i*2),n[3],n[0]));
  andromeda(t,S);
  // nebula tempat bintang lahir
  {const k=bounce('neb',t),nx=185,ny=-165;glow(nx-20,ny,70*k,'rgba(255,110,180,.5)');glow(nx+30,ny+15,60*k,'rgba(255,170,90,.4)');glow(nx,ny-25,50*k,'rgba(140,120,255,.45)');
   for(let i=0;i<6;i++)draw(j=>starPts(nx+(h(i*3)-.5)*90,ny+(h(i*5)-.5)*70,(4+h(i)*4)*(1+.3*Math.sin(t*3+i)),500+i,j),'#ffffff',1.4,1);body('neb',nx,ny,48,S,1)}
  cluster(t,S);
  mwBack(t,S);
  // sinar inti + cahaya galaksi
  for(let i=0;i<10;i++){const a=i/10*6.283+t*.12;x.fillStyle='rgba(255,220,160,.07)';x.beginPath();x.moveTo(0,0);x.arc(0,0,150+15*Math.sin(t*2+i),a,a+.2);x.closePath();x.fill()}
  glow(0,0,140,'rgba(255,214,250,'+(.5+.15*Math.sin(t*1.7))+')');
  // lengan spiral
  // saat masuk ke Tata Surya, gumpalan lengan mengecil supaya tidak menutupi planet
  const ak=cl((6.5-Z)/2.5);
  x.save();x.scale(1,.55);x.rotate(rot);
  if(ak>0){x.save();x.rotate(.6);draw(j=>blob(0,0,48*ak,15*ak,98,j),'#ffe2a8',1.8);x.restore()}
  if(ak>0)for(let a=0;a<3;a++)for(let i=0;i<13;i++){
    const f=(i+1)/13,r=100*(.25+.8*f),th=a*2.094+f*3.3,s=ak*100*(.09-.04*f)*(1+.14*Math.sin(t*2.4+i*.7+a*2)),bx=Math.cos(th)*r,by=Math.sin(th)*r;
    draw(j=>blob(bx,by,s,s,a*20+i,j),armCols[(a+i)%4],1.8);
    for(let d=0;d<2;d++){const q=h(a*50+i*5+d);draw(j=>blob(bx+(q-.5)*25,by+(h(q*9)-.5)*25,s*.4,s*.4,i+d*7,j),armCols[(a+i+d+1)%4],1.4)}
  }
  x.restore();
  // inti galaksi
  {const k=bounce('core',t);x.save();x.rotate(Math.sin(t*.6)*.08);x.scale(k,k);draw(j=>blob(0,0,30,27,99,j),SUN,3);face(0,0,30);x.restore();body('core',0,0,30,S,1)}
  mwFront(t,S);
  solar(t,dt,S);
  // meteor jatuh cepat
  {const s=(t%5)/1.1;if(s<1){const mx=310-600*s,my=-330+560*s;meteor(mx,my,13*bounce('met',t));body('met',mx,my,17,S,0)}}
  // tiga asteroid melayang pelan berdampingan: besar, sedang, kecil
  {const a=t*.03,ax=Math.cos(a)*290,ay=Math.sin(a)*205,k=bounce('ast',t);
   [[-36,8,20,0],[2,-10,12,2],[34,12,7,4]].forEach((q,i)=>{const px=ax+q[0],py=ay+q[1]+Math.sin(t*.7+q[3])*5;asteroid(px,py,q[2]*k,t*.15*(i%2?-1:1)+q[3],600+i*10);body('ast',px,py,q[2],S,i==0)})}
  // alien di piring terbang berkeliling; melesat kalau disentuh
  {const dg=drag&&drag.on;if(!dg)ufoPh+=dt*.12*boost('ufo',t);const b=ufoBase(),ux=dg?drag.x:b[0]+uOff.x,uy=(dg?drag.y:b[1]+uOff.y)+Math.sin(t*2.2)*5;ufo(ux,uy,24*bounce('ufo',t)*(dg?1.15:1),t);body('ufo',ux,uy-8,26,S,1)}
  // lingkaran penanda benda terpilih
  if(sel){const q=hits.find(v=>v.k==sel.k);if(q){x.save();x.translate(q.x,q.y);x.rotate(t*1.2);x.setLineDash([7/S,8/S]);x.strokeStyle='#fff';x.lineWidth=2.4/S;x.beginPath();x.arc(0,0,q.r*1.35+6/S,0,6.283);x.stroke();x.restore();x.setLineDash([])}}
  // bintang hasil sentuhan dan percikan dari benda yang disentuh
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i],age=t-p.t0,life=p.mini?.9:3;
    if(age<0)continue;if(age>life){pops.splice(i,1);continue}
    if(p.mini){const d=p.r+age*60/S;draw(j=>starPts(p.x+Math.cos(p.a)*d,p.y+Math.sin(p.a)*d,9/S*(1-age/life),300+i,j),['#ffd95a','#ff9ecb','#9ae6ff'][i%3],1.4,1)}
    else{const rr=22/S*(Math.min(1,age*4)+.15*Math.sin(age*10))*(age>2?3-age:1);if(rr*S>1.5)draw(j=>starPts(p.x,p.y-age*14/S,rr,300+i,j),['#ffd95a','#ff9ecb','#9ae6ff'][i%3],2.2,1)}
  }
  x.restore();LWS=1;PM=null;
  // ===== layar =====
  x.textAlign='center';x.textBaseline='top';x.lineJoin='round';x.font='bold '+Math.min(15,W*.04)+'px '+FONT;
  const used=[];labels.sort((a,b)=>(a.arm?1:0)-(b.arm?1:0)).forEach(l=>{const lx=(l.x-C.x)*S+vx,ly=(l.y-C.y)*S+vy+5;if(lx<-60||lx>W+60||ly<150||ly>H-10)return;const tw=x.measureText(l.t).width/2+3;if(used.some(u=>Math.abs(u[0]-lx)<u[2]+tw&&Math.abs(u[1]-ly)<15))return;used.push([lx,ly,tw]);x.lineWidth=3.5;x.strokeStyle='rgba(10,15,46,.85)';x.strokeText(l.t,lx,ly);x.fillStyle=l.arm?'#8fa6e0':found.has(l.k)?'#ffd95a':'#e8eeff';x.fillText(l.t,lx,ly)});
  // judul
  const ty=Math.max(40,H*.075),fs=Math.min(W*.1,52);
  x.save();x.translate(W/2,ty);x.rotate(Math.sin(t)*.015);
  x.font='bold '+fs+'px '+FONT;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=5;x.strokeStyle=BLUE;x.lineJoin='round';const ttl=nearAnd()?'Andromeda':nearClu()?U.clu:'The Milky Way';x.strokeText(ttl,0,0);x.fillStyle=nearAnd()?'#c9a0ff':nearClu()?'#9ae6ff':'#ffb347';x.fillText(ttl,0,0);
  x.restore();
  x.font='bold '+Math.min(14,W*.04)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffd95a';
  x.fillText(U.found(found.size,KEYS.length),W/2,ty+fs*.85);
  bar.style.top=(ty+fs*.85+18)+'px';
  if(!sel&&Z<3&&!nearAnd()&&!nearClu()){const L=50*S,bx=18,by=H-58;x.strokeStyle='#8fa6e0';x.lineWidth=1.5;x.beginPath();x.moveTo(bx,by-5);x.lineTo(bx,by);x.lineTo(bx+L,by);x.lineTo(bx+L,by-5);x.stroke();x.font=Math.min(13,W*.036)+'px '+FONT;x.textAlign='left';x.textBaseline='bottom';x.fillStyle='#8fa6e0';x.fillText(U.scale,bx,by-7);x.textAlign='center';x.textBaseline='middle'}
  card(t);
  if(!sel){
    x.font=Math.min(18,W*.045)+'px '+FONT;x.fillStyle='#c9d6ff';
    x.fillText(doneAt?U.done:U.hint,W/2,H-24);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
